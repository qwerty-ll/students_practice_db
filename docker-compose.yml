services:
  postgres:
    image: postgres:16-alpine
    container_name: students_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - ./schema_and_data.sql:/docker-entrypoint-initdb.d/init.sql
      - ./init_lab3.sql:/docker-entrypoint-initdb.d/zz_lab3.sql
      - ./lab3.sql:/lab3/lab3.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
